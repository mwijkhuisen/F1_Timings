# Dependabot: weekly, grouped, 7-day cooldown against fast worms (the same rule
# as minimumReleaseAge), no automerge (the owner merges every PR).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 5

  # The image bases of deploy/{server,web}/Dockerfile (pinned by digest).
  - package-ecosystem: docker
    directories: [/deploy/server, /deploy/web]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      images:
        patterns: ['*']
    open-pull-requests-limit: 5

  # postgres and cloudflared in deploy/compose.yaml. PGDATA is per postgres major, so a major
  # bump is never a PR: it goes through docs/runbooks/update.md "A PostgreSQL major upgrade". A
  # postgres minor gets its own PR (not in the group), and test/pins.test.ts fails it until the
  # owner pushes the matching service image line in ci.yml (Dependabot cannot edit that file).
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      compose-images:
        patterns: ['*']
        exclude-patterns: [postgres]
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
