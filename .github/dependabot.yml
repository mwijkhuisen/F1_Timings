# Dependabot: weekly, grouped, 7-day cooldown against fast worms (the same rule
# as minimumReleaseAge), no automerge (the owner merges every PR).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 5
