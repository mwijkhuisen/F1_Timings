# CI (PHASES P0). The required check is the aggregate job `ci`. Hardening:
# top-level permissions {}, contents: read per job, persist-credentials: false,
# no caches, no expressions inside run: (values come in through env:), actions
# pinned to full SHAs and downloaded binaries checked against pinned sha256 sums.
# CI never calls OpenF1, F1 or Jolpica (A§12.1 invariant 4).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  # A PR's runs share one group and cancel superseded ones. Any other run's group carries its commit
  # (#208): a run whose release waits for approval holds its group, and GitHub keeps one pending run
  # per group, so in a per-ref group the next push would wait and a third one cancel it unchecked.
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (pinned native binary, sha512-checked)
        run: |
          scripts/install-pnpm.sh "$RUNNER_TEMP/pnpm"
          echo "$RUNNER_TEMP/pnpm/bin" >>"$GITHUB_PATH"
      - name: pnpm policy is in effect (pnpm ignores a misspelt key)
        run: |
          test "$(pnpm config get minimumReleaseAge)" = 10080
          test "$(pnpm config get strictDepBuilds)" = true
          test "$(pnpm config get blockExoticSubdeps)" = true
      # pnpm 12.5.1 still lets a transitive https tarball through blockExoticSubdeps.
      - name: Every lockfile resolution is a registry integrity hash (no git or tarball source)
        run: |
          if grep 'resolution:' pnpm-lock.yaml | grep -vE '^\s+resolution: \{integrity: sha512-[A-Za-z0-9+/]+=*\}$'; then
            echo "pnpm-lock.yaml resolves a package from outside the registry" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # The dbmate round trip: the test creates a database on the PG 18 service and
  # runs the migrate role (dbmate migrate) → a rollback of every migration → migrate.
  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          # Throwaway CI-only credential for an ephemeral service container.
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      DBMATE_VERSION: v2.36.0
      DBMATE_SHA256: 47e284b3d8cbad1ba5f090495aa05afd1bbd5f35e2ed5577aad06da74ce780ce
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dbmate (pinned, sha256-checked)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl --proto '=https' -fsSL -o "$RUNNER_TEMP/bin/dbmate" \
            "https://github.com/amacneil/dbmate/releases/download/$DBMATE_VERSION/dbmate-linux-amd64"
          echo "$DBMATE_SHA256  $RUNNER_TEMP/bin/dbmate" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/dbmate"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm (pinned native binary, sha512-checked)
        run: |
          scripts/install-pnpm.sh "$RUNNER_TEMP/pnpm"
          echo "$RUNNER_TEMP/pnpm/bin" >>"$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: pnpm test:integration (dbmate up → down → up on a new database)
        run: pnpm test:integration

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck (pinned, sha256-checked)
        run: |
          tarball="shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.gz"
          curl --proto '=https' -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$tarball"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
      - name: shellcheck every shell script (deploy/bin has no extensions; '*.sh' covers deploy/tests)
        run: |
          mapfile -t files < <(git ls-files '*.sh' 'deploy/bin/*' 'deploy/tests/*.sh')
          "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION/shellcheck" --version
          "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION/shellcheck" "${files[@]}"

  # P1f: build both images, then the compose hardening check, the nft table check and the
  # end-to-end install/update/rollback run on the runner's Docker (nothing leaves the runner).
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      F1_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: docker version
        run: docker version
      - name: Install nftables (the e2e run needs the nft binary)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables >/dev/null
      - name: Build f1-server:ci
        run: docker build -f deploy/server/Dockerfile --build-arg "F1_REVISION=$F1_REVISION" -t f1-server:ci .
      - name: Build f1-web:ci
        run: docker build -f deploy/web/Dockerfile --build-arg "F1_REVISION=$F1_REVISION" -t f1-web:ci .
      - name: hardening
        run: bash deploy/tests/hardening.sh
      - name: nft-check
        run: bash deploy/tests/nft-check.sh
      - name: e2e
        run: sudo bash deploy/tests/e2e.sh

  ci:
    name: ci
    if: always()
    needs: [check, integration, shellcheck, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' >/dev/null

  # #208: a release only when a build input changed since the commit that :main carries, so a
  # docs-only merge asks no approval and redeploys nothing. It runs before the environment gate and
  # holds no secret: it reads the public images' config (no pull, nothing runs) and diffs two commits.
  # The inputs are the .dockerignore allowlist, .dockerignore and the two Dockerfiles
  # (test/pins.test.ts holds the list equal). Labels that cannot be read or differ release.
  changes:
    name: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.diff.outputs.release }}
    env:
      REGISTRY_PREFIX: ghcr.io/mwijkhuisen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Did a build input change since the released commit?
        id: diff
        run: |
          set -f # the entries are git pathspecs (below), not shell globs
          paths=(
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            tsconfig.base.json
            scripts/install-pnpm.sh
            apps/*/package.json
            apps/*/tsconfig.json
            apps/*/src
            apps/web/index.html
            apps/web/vite.config.ts
            apps/web/icon.ts
            apps/web/public
            packages/*/package.json
            packages/*/tsconfig.json
            packages/*/src
            db/migrations
            deploy/web/Caddyfile
            .dockerignore
            deploy/server/Dockerfile
            deploy/web/Dockerfile
          )
          # Docker's matching: * stays inside one path segment, and a directory covers what is below it.
          specs=()
          for p in "${paths[@]}"; do specs+=(":(glob)$p" ":(glob)$p/**"); done
          label() {
            timeout 60 docker buildx imagetools inspect "$REGISTRY_PREFIX/f1-$1:main" --format '{{json .Image}}' |
              jq -r '(if has("config") then . else .["linux/amd64"] end).config.Labels["org.opencontainers.image.revision"] // empty'
          }
          server=$(label server) || server=''
          web=$(label web) || web=''
          if [[ ! $server =~ ^[0-9a-f]{40}$ || $web != "$server" ]] || ! git merge-base --is-ancestor "$server" HEAD; then
            echo "::notice::the revision labels of :main cannot be read, differ or name no ancestor of this commit: releasing"
            release=true
          elif git diff --quiet "$server" HEAD -- "${specs[@]}"; then
            echo "::notice::no build input changed since $server: no release"
            release=false
          else
            echo "build inputs changed since $server:"
            git diff --name-only "$server" HEAD -- "${specs[@]}"
            release=true
          fi
          echo "release=$release" >>"$GITHUB_OUTPUT"

  # Push to main only, after the aggregate is green and when `changes` found a changed build input.
  # The one job with packages: write. Its own group runs one release at a time; GitHub keeps one
  # pending job per group, so a newer queued release replaces an older queued one. An approval given
  # after a newer commit reached main stops at the first step, so :main never moves backwards.
  # No cosign/attest/SBOM.
  release:
    name: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.release == 'true'
    needs: [ci, changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    environment: production
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      F1_REVISION: ${{ github.sha }}
      REGISTRY_PREFIX: ghcr.io/mwijkhuisen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The public repository answers ls-remote without a token. Its pattern also matches refs that
      # end in refs/heads/main, hence the exact name. A failed or unexpected answer fails the job.
      - name: Stop unless this commit is still the tip of main
        id: tip
        run: |
          tip=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/main | awk '$2 == "refs/heads/main" { print $1 }')
          if [[ ! $tip =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::cannot read the tip of main: no release"
            exit 1
          elif [[ $tip == "$F1_REVISION" ]]; then
            echo "newest=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::main has moved on from $F1_REVISION to $tip: no release. The run of $tip releases; if it does not (red, or its release rejected), re-run its failed jobs."
            echo "newest=false" >>"$GITHUB_OUTPUT"
          fi
      - name: Build f1-server and f1-web with their tags
        if: steps.tip.outputs.newest == 'true'
        run: |
          for img in server web; do
            docker build -f "deploy/$img/Dockerfile" --build-arg "F1_REVISION=$F1_REVISION" \
              -t "$REGISTRY_PREFIX/f1-$img:sha-$F1_REVISION" -t "$REGISTRY_PREFIX/f1-$img:main" .
          done
      - name: Log in to ghcr.io and push all four tags
        if: steps.tip.outputs.newest == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for img in server web; do
            docker push "$REGISTRY_PREFIX/f1-$img:sha-$F1_REVISION"
            docker push "$REGISTRY_PREFIX/f1-$img:main"
          done
      - name: Record the pushed digests
        if: steps.tip.outputs.newest == 'true'
        run: |
          {
            echo '### Pushed images (RepoDigests)'
            for img in server web; do
              docker image inspect --format '{{range .RepoDigests}}- `{{.}}`{{"\n"}}{{end}}' "$REGISTRY_PREFIX/f1-$img:main"
            done
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Log out of ghcr.io
        if: always()
        run: docker logout ghcr.io
