# CI only: deploy/tests/e2e.sh passes it to f1-update as F1_COMPOSE_OVERRIDE. Never installed on
# the VM. ingest and cloudflared get a profile that nothing activates, so `up` never starts them:
# CI never calls OpenF1 or Cloudflare (invariant 4). live does start, and is safe here only because
# the schedule is empty: without ingest the session table has no row, so live idles and calls
# nothing (no login is due, no feed, no ping without a recording). e2e asserts that the table is
# empty. If anything ever seeds a session here, live must go back behind the profile.
services:
  ingest:
    profiles: ["off"]
  cloudflared:
    profiles: ["off"]
